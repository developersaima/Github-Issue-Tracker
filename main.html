<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/assets/github-logo.png"
      type="image/x-icon"
    />
    <title>Github Issue Tracker</title>

    <!-- tailwind & daisy -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- fontawesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
    />

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      html {
        background: #f8fafc;
      }
      .font-geist {
        font-family: "Geist", sans-serif;
      }
      .filter_btn_active {
        background-color: #4a00ff;
        color: white;
      }
    </style>
  </head>

  <body class="font-geist bg-[#f8fafc] min-h-screen w-full">
    <!-- navbar -->
    <header>
      <nav
        class="bg-white shadow p-4 navbar flex justify-between items-center flex-col md:flex-row gap-4 fixed top-0 left-0 right-0 z-9"
      >
        <!-- logo -->
        <a href="app.html" class="flex gap-2 items-center">
          <img
            src="./assets/github-logo.png"
            alt="github-logo"
            class="w-8 h-8 mb-0.5"
          />
          <h2 class="text-2xl font-semibold text-black">
            GitHub Issues Tracker
          </h2>
        </a>

        <!-- search & new issue -->
        <div class="flex gap-4">
          <label class="input outline-0 relative">
            <i class="fa-solid fa-magnifying-glass text-[#64748b]"></i>
            <input
              type="search"
              id="user-search-input"
              class="grow text-[#64748b]"
              placeholder="Search issues..."
            />
          </label>
          <button class="btn bg-[#4a00ff] text-white" type="button">
            <i class="fas fa-plus"></i>
            New Issue
          </button>
        </div>
      </nav>
    </header>

    
</body>
</html>
